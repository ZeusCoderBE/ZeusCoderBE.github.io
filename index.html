<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Bộ tài liệu AI Engineer được tổng hợp và chọn lọc, gồm tài liệu học, video YouTube, roadmap, GitHub source tham khảo, review CV và mentor career path.">
	<meta name="author" content="Anh Kỹ Sư AI">
	<meta property="og:title" content="Anh Kỹ Sư AI | Bộ tài liệu AI Engineer">
	<meta property="og:description" content="Tài liệu AI Engineer được tổng hợp và chọn lọc cho sinh viên và người mới theo đuổi AI Engineer.">
	<meta property="og:type" content="website">
	<title>Anh Kỹ Sư AI | Bộ tài liệu AI Engineer</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&display=swap" rel="stylesheet">
	<style>
		:root {
			--ink: #0d1224;
			--ink-soft: #27304c;
			--muted: #65708d;
			--white: #ffffff;
			--blue: #1454ff;
			--blue-dark: #092a88;
			--cyan: #40d8ff;
			--violet: #855bff;
			--orange: #ff7a1a;
			--green: #12b886;
			--line: rgba(13, 18, 36, 0.12);
			--shadow: 0 28px 80px rgba(9, 42, 136, 0.16);
			--radius: 30px;
			--max: 1160px;
			--font-body: "Be Vietnam Pro", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			--font-display: "Fraunces", Georgia, serif;
		}

		* {
			box-sizing: border-box;
		}

		html {
			scroll-behavior: smooth;
		}

		body {
			margin: 0;
			font-family: var(--font-body);
			color: var(--ink);
			background:
				radial-gradient(circle at top left, rgba(64, 216, 255, 0.24), transparent 28%),
				radial-gradient(circle at 92% 10%, rgba(133, 91, 255, 0.18), transparent 26%),
				linear-gradient(180deg, #f7fbff 0%, #edf4ff 42%, #f9fbff 100%);
			line-height: 1.6;
		}

		a {
			color: inherit;
			text-decoration: none;
		}

		.page {
			min-height: 100vh;
			overflow: hidden;
		}

		.container {
			width: min(calc(100% - 32px), var(--max));
			margin: 0 auto;
		}

		.header {
			padding: 22px 0;
		}

		.nav {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 18px;
			padding: 12px 14px;
			border: 1px solid rgba(255, 255, 255, 0.72);
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.72);
			box-shadow: 0 18px 60px rgba(9, 42, 136, 0.08);
			backdrop-filter: blur(18px);
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 12px;
			font-weight: 900;
		}

		.brand-mark {
			width: 44px;
			height: 44px;
			display: grid;
			place-items: center;
			border-radius: 16px;
			background: linear-gradient(135deg, var(--blue), var(--cyan));
			color: var(--white);
			box-shadow: 0 14px 30px rgba(20, 84, 255, 0.26);
		}

		.nav-link {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 44px;
			padding: 0 16px;
			border-radius: 999px;
			background: var(--ink);
			color: var(--white);
			font-weight: 800;
			white-space: nowrap;
		}

		.hero {
			padding: 44px 0 34px;
		}

		.hero-grid {
			display: grid;
			grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
			gap: 24px;
			align-items: stretch;
		}

		.hero-copy,
		.hero-visual,
		.doc-card,
		.package-card,
		.bonus-card,
		.contact-panel {
			border: 1px solid rgba(255, 255, 255, 0.8);
			background: rgba(255, 255, 255, 0.76);
			box-shadow: var(--shadow);
			backdrop-filter: blur(20px);
		}

		.hero-copy {
			padding: clamp(28px, 5vw, 52px);
			border-radius: 38px;
		}

		.kicker {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			padding: 9px 13px;
			border-radius: 999px;
			background: rgba(20, 84, 255, 0.1);
			color: var(--blue-dark);
			font-size: 0.78rem;
			font-weight: 900;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		h1,
		h2,
		h3,
		p {
			margin-top: 0;
		}

		h1,
		h2,
		h3 {
			font-family: var(--font-display);
			line-height: 0.98;
			letter-spacing: -0.04em;
		}

		h1 {
			margin: 18px 0;
			font-size: clamp(3rem, 7.6vw, 7.4rem);
			max-width: 10ch;
		}

		.hero-copy p {
			max-width: 62ch;
			color: var(--ink-soft);
			font-size: 1.06rem;
			font-weight: 600;
		}

		.hero-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			margin-top: 26px;
		}

		.button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 50px;
			padding: 0 18px;
			border-radius: 999px;
			font-weight: 900;
			transition: transform 180ms ease, box-shadow 180ms ease;
		}

		.button:hover {
			transform: translateY(-2px);
			box-shadow: 0 16px 32px rgba(13, 18, 36, 0.14);
		}

		.button-primary {
			background: linear-gradient(135deg, var(--blue), var(--violet));
			color: var(--white);
		}

		.button-secondary {
			border: 1px solid var(--line);
			background: var(--white);
		}

		.hero-tags {
			display: flex;
			flex-wrap: wrap;
			gap: 9px;
			margin-top: 26px;
		}

		.hero-tags span {
			padding: 9px 12px;
			border-radius: 999px;
			background: rgba(13, 18, 36, 0.06);
			color: var(--ink-soft);
			font-size: 0.88rem;
			font-weight: 800;
		}

		.hero-visual {
			position: relative;
			min-height: 520px;
			padding: 28px;
			border-radius: 38px;
			overflow: hidden;
			background:
				radial-gradient(circle at 75% 18%, rgba(255, 122, 26, 0.2), transparent 28%),
				linear-gradient(150deg, rgba(255, 255, 255, 0.9), rgba(223, 238, 255, 0.78));
		}

		.visual-card {
			position: relative;
			z-index: 1;
			padding: 22px;
			border: 1px solid var(--line);
			border-radius: 28px;
			background: var(--white);
			box-shadow: 0 22px 50px rgba(13, 18, 36, 0.12);
		}

		.visual-title {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin-bottom: 18px;
			font-weight: 900;
		}

		.visual-title span {
			padding: 7px 10px;
			border-radius: 999px;
			background: rgba(255, 122, 26, 0.12);
			color: var(--orange);
			font-size: 0.8rem;
		}

		.folder-list {
			display: grid;
			gap: 12px;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.folder-list li {
			display: grid;
			grid-template-columns: 44px 1fr;
			gap: 12px;
			align-items: center;
			padding: 14px;
			border: 1px solid rgba(13, 18, 36, 0.08);
			border-radius: 18px;
			background: #f8fbff;
			font-weight: 800;
		}

		.folder-icon {
			width: 44px;
			height: 38px;
			border-radius: 10px 10px 12px 12px;
			background: linear-gradient(135deg, var(--blue), var(--cyan));
			position: relative;
		}

		.folder-icon::before {
			content: "";
			position: absolute;
			left: 5px;
			top: -5px;
			width: 18px;
			height: 10px;
			border-radius: 7px 7px 0 0;
			background: var(--blue);
		}

		.robot {
			position: absolute;
			right: -16px;
			bottom: -18px;
			width: 210px;
			height: 210px;
			border-radius: 48% 48% 38% 38%; 
			background: linear-gradient(180deg, #ffffff, #dff8ff);
			border: 10px solid rgba(64, 216, 255, 0.55);
			box-shadow: 0 24px 70px rgba(20, 84, 255, 0.2);
		}

		.robot::before {
			content: "";
			position: absolute;
			left: 34px;
			top: 44px;
			width: 122px;
			height: 82px;
			border-radius: 28px;
			background: #17254b;
			box-shadow: inset 0 -10px 0 rgba(255, 255, 255, 0.06);
		}

		.robot::after {
			content: "•  •";
			position: absolute;
			left: 67px;
			top: 42px;
			color: var(--cyan);
			font-size: 56px;
			letter-spacing: 18px;
			line-height: 1;
		}

		.section {
			padding: 40px 0;
		}

		.section-head {
			display: grid;
			grid-template-columns: minmax(0, 1fr) minmax(280px, 0.48fr);
			gap: 20px;
			align-items: end;
			margin-bottom: 22px;
		}

		.section-head h2 {
			margin: 12px 0 0;
			font-size: clamp(2.2rem, 5vw, 4.6rem);
		}

		.section-head p {
			margin-bottom: 0;
			color: var(--muted);
			font-weight: 600;
		}

		.docs-grid,
		.package-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 18px;
		}

		.doc-card,
		.package-card,
		.bonus-card,
		.contact-panel {
			border-radius: var(--radius);
			padding: 24px;
		}

		.doc-card.featured,
		.package-card.featured {
			background: linear-gradient(145deg, #10215c, #164dff);
			color: var(--white);
		}

		.package-card:nth-child(1) {
			background: linear-gradient(145deg, #fff7ed, #ffffff);
			border-color: rgba(255, 122, 26, 0.2);
		}

		.package-card:nth-child(2) {
			background: linear-gradient(145deg, #ecfeff, #ffffff);
			border-color: rgba(8, 145, 178, 0.2);
		}

		.package-card:nth-child(3) {
			background: linear-gradient(145deg, #24106a, #6d28d9);
			border-color: rgba(109, 40, 217, 0.36);
			color: var(--white);
		}

		.package-card:nth-child(4) {
			background: linear-gradient(145deg, #f0fdf4, #ffffff);
			border-color: rgba(18, 184, 134, 0.22);
		}

		.package-card:nth-child(3) p,
		.package-card:nth-child(3) .clean-list li {
			color: rgba(255, 255, 255, 0.9);
		}

		.package-card:nth-child(1) .price {
			background: #ff7a1a;
		}

		.package-card:nth-child(2) .price {
			background: #0891b2;
		}

		.package-card:nth-child(3) .price {
			background: #f59e0b;
		}

		.package-card:nth-child(4) .price {
			background: #12b886;
		}

		.package-card:nth-child(1) .package-label {
			background: rgba(255, 122, 26, 0.13);
			color: #c2410c;
		}

		.package-card:nth-child(2) .package-label {
			background: rgba(8, 145, 178, 0.13);
			color: #0e7490;
		}

		.package-card:nth-child(3) .package-label {
			background: rgba(255, 255, 255, 0.16);
			color: var(--white);
		}

		.package-card:nth-child(4) .package-label {
			background: rgba(18, 184, 134, 0.13);
			color: #087f5b;
		}
